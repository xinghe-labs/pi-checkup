name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check every source file
        run: npm run lint
      - name: Unit tests
        run: node --test
      - name: CLI smoke test
        shell: bash
        run: |
          node bin/checkup.js --version
          node bin/checkup.js --help
          # A bare runner has no ~/.pi/agent, so the config checks are expected to
          # fail here; what must hold is that a report is still produced and that
          # the exit code reflects a failure rather than being swallowed.
          set +e
          node bin/checkup.js --offline --json > report.json
          code=$?
          set -e
          node -e "
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('report.json', 'utf8'));
          if (!r.summary || !Array.isArray(r.checks)) throw new Error('bad report shape');
          if (r.summary.total !== r.checks.length) throw new Error('summary disagrees with checks');
          if (r.checks.some((c) => 'fix' in c || 'fixTarget' in c)) throw new Error('repair metadata leaked');
          const failed = r.summary.fail > 0;
          if (failed !== (process.argv[1] !== '0')) throw new Error('exit code ' + process.argv[1] + ' disagrees with fail count ' + r.summary.fail);
          console.log('report ok:', JSON.stringify(r.summary), 'exit', process.argv[1]);
          " "$code"

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Manifest declares the extension entry
        run: |
          node -e "
          const pkg = require('./package.json');
          if (!pkg.keywords.includes('pi-package')) throw new Error('missing pi-package keyword');
          const entries = pkg.pi?.extensions ?? [];
          if (!entries.length) throw new Error('pi.extensions is empty');
          const fs = require('fs');
          for (const e of entries) {
            if (!fs.existsSync(e.replace(/^\.\//, ''))) throw new Error('missing entry: ' + e);
          }
          if (!pkg.files.includes('src/')) throw new Error('files[] would exclude the source');
          if (!pkg.files.includes('bin/')) throw new Error('files[] would exclude the CLI');
          if (!pkg.bin['pi-checkup']) throw new Error('bin entry missing');
          if (!fs.existsSync(pkg.bin['pi-checkup'].replace(/^\.\//, ''))) throw new Error('bin entry file missing');
          console.log('manifest ok');
          "
      - name: Packed tarball contains the entry point
        shell: bash
        run: |
          # pipefail: without it the pipeline reports tee's status and a failed
          # pack would sail through to the greps.
          set -o pipefail
          npm pack --dry-run 2>&1 | tee pack.log
          grep -q 'src/index.js' pack.log
          grep -q 'bin/checkup.js' pack.log
      # A file list is not proof that the published artifact works: a missing
      # relative import or a files[] entry that drops a module shows up only when
      # the tarball is unpacked and executed.
      - name: Packed tarball actually runs
        shell: bash
        run: |
          set -euo pipefail
          npm pack 2>/dev/null
          tarball=$(ls pi-checkup-*.tgz)
          root=$(mktemp -d)
          cd "$root"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$OLDPWD/$tarball" >/dev/null
          version=$(./node_modules/.bin/pi-checkup --version)
          echo "packed CLI reports $version"
          mkdir -p agent
          printf '%s' '{"packages":[]}' > agent/settings.json
          # A fresh install with an empty package list must not be reported as a
          # broken config, and must produce a full report.
          PI_CODING_AGENT_DIR="$root/agent" ./node_modules/.bin/pi-checkup --offline --json > report.json
          node -e "
          const r = require('./report.json');
          if (r.summary.total !== r.checks.length) throw new Error('summary disagrees with checks');
          if (r.summary.fail !== 0) throw new Error('fresh install reported failures: ' + JSON.stringify(r.checks.filter(c => c.status === 'fail')));
          console.log('packed CLI report ok:', JSON.stringify(r.summary));
          "
          # The CLI and the extension are two entry points over the same source. The
          # tarball check above proves the first one loads; nothing proved the second
          # one is even importable, so a broken relative import in the extension
          # entry would only surface when a user installed the package.
          node --input-type=module -e "
          import('./node_modules/pi-checkup/src/index.js').then((mod) => {
            if (typeof mod.default !== 'function') throw new Error('entry does not export a function');
            const seen = [];
            mod.default({ registerCommand: (name, def) => seen.push({ name, def }) });
            if (seen.length !== 1) throw new Error('expected one command, got ' + seen.length);
            if (seen[0].name !== 'checkup') throw new Error('unexpected command name: ' + seen[0].name);
            if (typeof seen[0].def.handler !== 'function') throw new Error('command has no handler');
            if (!seen[0].def.description) throw new Error('command has no description');
            console.log('packed extension registers /' + seen[0].name);
          }).catch((e) => { console.error(e); process.exit(1); });
          "
